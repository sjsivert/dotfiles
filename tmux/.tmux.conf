# shell
set -g default-command $SHELL #/usr/bin/zsh

set -g default-shell $SHELL #/usr/bin/zsh
# Set delay from pane switch until keyboard will work as normal to 200ms
set-option repeat-time 0

# screen mode
set -g default-terminal "screen-256color"

# start with window 1 (instead of 0)
set -g base-index 1

# renumber windows after closing
set -g renumber-windows on

# start with pane 1
set -g pane-base-index 1

# remove esc delay
set -sg escape-time 0

# Claude Code (https://hboon.com/using-tmux-with-claude-code/)
# let programs send escape sequences straight to iTerm2, so Claude Code's
# desktop notifications and progress updates get past tmux. only the
# visible pane can do this ("all" would include hidden panes too).
set -gq allow-passthrough on
# report modified keys (shift+enter, ctrl+enter, ...) to programs that ask
# for them, so Claude Code can tell shift+enter (newline) from enter (submit)
set -sq extended-keys on
# tell tmux the outer terminal (TERM=xterm*) understands extended keys
set -asq terminal-features 'xterm*:extkeys'

# Claude Code overview. ~/.claude/tools/tmux-claude, run by Claude's hooks,
# keeps @claude_state on each pane that runs Claude: working, waiting (on
# you), error, done (finished while you looked elsewhere) or idle.
# @claude_icon draws it as one coloured mark.
set -g @claude_icon '#{?#{==:#{@claude_state},waiting},#[fg=red]#[bold]●#[nobold],#{?#{==:#{@claude_state},error},#[fg=red]✗,#{?#{==:#{@claude_state},done},#[fg=green]✓,#{?#{==:#{@claude_state},working},#[fg=yellow]◐,#{?#{==:#{@claude_state},idle},#[fg=brightblack]○,}}}}}#[fg=default]'
# prefix + W: like prefix + w, but only the panes that run Claude. Each
# shows its state and since when, its folder, Claude's title for the
# conversation and the tool it runs or waits on.
set -g @claude_tree '#{?pane_format,#{E:@claude_icon} #{p7:@claude_state} #{p5:#{t/p:@claude_since}}  #{p16:#{=16:#{b:pane_current_path}}} #{s/^[^A-Za-z0-9]+ //:pane_title}#{?@claude_detail, · #{@claude_detail},},#{?window_format,#{window_name} #{P:#{E:@claude_icon}},#{W:#{P:#{E:@claude_icon}}}}}'
bind W choose-tree -Z -f '#{||:#{@claude_state},#{m/r:^(claude|[0-9.]+)$,#{pane_current_command}}}' -F '#{E:@claude_tree}'
# prefix + N: go to the Claude that has waited longest for you
bind N run-shell '~/.claude/tools/tmux-claude next #{pane_id} #{client_name}'
# looking at a finished Claude clears its done mark
set-hook -g pane-focus-in 'if -F "#{==:#{@claude_state},done}" "set -p @claude_state idle"'

# history
set -g history-limit 10000

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# pleb mode
set -g mouse on

# copy to  system buffer instead of tmux buffer
if-shell 'test "$(uname)" = Darwin' \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel"

# prefix + y: pick lines from this pane's whole scrollback with fzf and copy
# them to the system buffer. Newest first, duplicates dropped, Tab selects
# several lines. Wrapped lines are joined, so a long command comes out whole.
# the capture runs in run-shell because display-popup does not expand #{pane_id}
bind y run-shell "tmux capture-pane -p -J -S - -t '#{pane_id}' | tail -r | awk 'NF && !seen[$0]++' > /tmp/tmux-copy-pick" \; display-popup -E -w 90% -h 80% "fzf -m --no-sort --layout=reverse --prompt='copy> ' < /tmp/tmux-copy-pick | pbcopy"

# panes
#set -g pane-border-style "fg=colour0"
#set -g pane-active-border-style "fg=colour0"
#set -g window-active-style 'bg=colour236'
#set -g window-style 'bg=black'

# status line
set -g status-justify left
set -g status-style "bg=colour0,fg=colour14"
set -g status-interval 2

# messaging
set -g message-style "bg=colour14,fg=colour0"
set -g message-command-style "bg=colour1,fg=colour14"

# window mode
setw -g mode-style "bg=colour14,fg=colour0"

# split sytle
set -g pane-border-style "bg=colour0,fg=colour0"
set -g pane-active-border-style "bg=colour0,fg=colour0"

#resizing
setw -g aggressive-resize on

# window status
set-option -g status-position bottom
# allow programs (Claude Code) to rename window via escape seq.
# when a program sets the name, tmux auto-disables automatic-rename for
# that window, so the Claude summary sticks; other windows keep the
# path-command auto name below.
set-window-option -g allow-rename on
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_path} - #{pane_current_command}'
# display the window NAME (#W) so Claude's summary actually shows.
# for non-renamed windows #W == the automatic-rename-format above.
setw -g window-status-format "#[bg=colour246,fg=colour0,noreverse]█▓░ #W "
setw -g window-status-current-format "#[bg=colour14,fg=colour0,noreverse]█▓░ #W "

# info on right
set -g status-right-length 100
set -g status-right '#(~/bin/tmux-status)'
# info on left (no session display)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity on
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# tmux clock
set -g clock-mode-colour colour14

# prefix: C-a on the Mac. On any other machine (a server reached over ssh)
# it is C-b, with C-a as a second prefix. So with a local tmux around an ssh
# session, C-a drives the local tmux and C-b passes through to the one on the
# server. Without a local tmux around it, either key works on the server.
unbind C-b
set-option -g prefix C-a
bind C-a  send-prefix
if-shell 'test "$(uname)" != Darwin' \
  'set -g prefix C-b ; set -g prefix2 C-a ; bind C-b send-prefix ; bind C-a send-prefix -2'

# vim style copy paste mode
unbind [
# in a fullscreen Claude Code pane the conversation lives on the alternate
# screen, where copy mode can't see it. open it in $VISUAL instead: ctrl+o
# enters Claude's transcript mode, then v opens the editor. Claude's process
# name is its version number (2.1.289). after ctrl+o [ dumps the conversation
# to the normal screen, Escape gives plain copy mode again.
  bind Escape if -F '#{&&:#{alternate_on},#{m/r:^(claude|[0-9.]+)$,#{pane_current_command}}}' \
    'send-keys C-o v' \
    'copy-mode'
  unbind p
  bind p paste-buffer
  bind-key -Tcopy-mode-vi 'v' send -X begin-selection

# splitting
  unbind %
  bind s split-window -v
  unbind '"'
#unbind s
  bind v split-window -h

# navigate and resize splits


# zoom split
#unbind z
#bind z if-shell "$is_vim" "send-keys ,z" "resize-pane -Z"
#	bind Z resize-pane -Z

# vim style commands
  bind : command-prompt

# source config file
  bind r source-file ~/.tmux.conf \; display-message "█▓░ ~/.tmux.conf reloaded."

# other random key-binding changes
  bind x kill-pane
  bind t set status
  bind a set-window-option synchronize-panes \; display-message "█▓░ synchronize"
# vim-like pane resizing
  bind -r C-k resize-pane -U
  bind -r C-j resize-pane -D
  bind -r C-h resize-pane -L
  bind -r C-l resize-pane -R

# vim-like pane switching
  bind -r k select-pane -U
  bind -r j select-pane -D
  bind -r h select-pane -L
  bind -r l select-pane -R

# bind key to move pane to new window
#bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
  bind-key -r p command-prompt -p "send pane to:"  "break-pane -t '%%'"

# and now unbind keys
  unbind Up
  unbind Down
  unbind Left
  unbind Right

  unbind C-Up
  unbind C-Down
  unbind C-Left
  unbind C-Right


# TMUX TPM Plugin Manager
# ctrl + a + I to install plugins
# List of plugins
  set -g @plugin 'tmux-plugins/tpm'
  set -g @plugin 'tmux-plugins/tmux-sensible'
  set -g @plugin 'christoomey/vim-tmux-navigator'

  set -g @plugin 'abhinav/tmux-fastcopy'
# copy to system clipboard
  set-option -g set-clipboard on
  set-option -g @fastcopy-action 'tmux load-buffer -w -'
# Nord Theme
  set -g @plugin "arcticicestudio/nord-tmux"

# use c-k/c-j to move commits up/down within lazygit
  is_lg="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?lazygit$'"

  bind -n C-j if "$is_lg" "send-keys C-j"  "select-pane -D"
  bind -n C-k if "$is_lg" "send-keys C-k"  "select-pane -U"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
  bind -n C-j if-shell "[ #{pane_current_command} = lazygit ]" "send-keys C-j"  "select-pane -D"
  bind -n C-k if-shell "[ #{pane_current_command} = lazygit ]" "send-keys C-k"  "select-pane -U"
# END: use c-k/c-j to move commits up/down within lazygit


# a machine without tpm clones it first (needs git and internet access). the
# if-shell waits for the clone, so the line below finds tpm.
if-shell 'test -d ~/.tmux/plugins/tpm || git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm' ''

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# then fetch any plugin that is missing. run in the background, because the
# installer asks this tmux server for the plugin list.
if-shell 'test -x ~/.tmux/plugins/tpm/bin/install_plugins && test ! -d ~/.tmux/plugins/nord-tmux' \
  "run-shell -b '~/.tmux/plugins/tpm/bin/install_plugins'"

# nord-tmux sets the status formats when tpm runs, so the Claude marks are
# added after it: each window gets a mark per Claude in it, and the session
# name is followed by how many Claudes in any session wait on you (●) or
# have finished (✓).
set -g @claude_waiting '#{n:#{S:#{W:#{P:#{?#{m/r:^(waiting|error)$,#{@claude_state}},x,}}}}}'
set -g @claude_done '#{n:#{S:#{W:#{P:#{?#{==:#{@claude_state},done},x,}}}}}'
set -g status-left-length 40
set -ga status-left '#{?#{!=:#{E:@claude_waiting},0},#[fg=red]#[bold] ● #{E:@claude_waiting} #[nobold],}#{?#{!=:#{E:@claude_done},0},#[fg=green] ✓ #{E:@claude_done} ,}#[fg=default]'
set -ga window-status-format '#{?#{P:#{@claude_state}},#{P:#{E:@claude_icon}} ,}'
set -ga window-status-current-format '#{?#{P:#{@claude_state}},#{P:#{E:@claude_icon}} ,}'

# on a server, tell the two status bars apart when tmux runs inside tmux: put
# this one on top and name the machine
if-shell 'test "$(uname)" != Darwin' \
  'set -g status-position top ; set -ga status-left "#[fg=colour3,bold] #H #[default]"'
